name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (no warnings allowed)
        run: npx eslint . --max-warnings 0
      - name: Type-check
        run: npx tsc -b
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: jenish0908/assetflow-be
          path: backend
      - name: Start API, worker and Postgres with demo data
        working-directory: backend
        run: bash scripts/demo.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and serve the UI
        run: |
          npm run build
          API_URL=http://localhost:8080 nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf localhost:4173/api/readyz && break; sleep 1; done
      - name: End-to-end tests (real API, worker and database)
        run: npx playwright test
        env:
          BASE_URL: http://localhost:4173
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Backend logs
        if: failure()
        working-directory: backend
        run: docker compose --profile app logs --tail 100 api worker

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: assetflow-fe:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: docker image ls assetflow-fe:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
